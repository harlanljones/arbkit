[package]
name = "arbkit-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Hot loop, preallocated order book slab, SPSC queue, and latency histogram"

[dependencies]
arbkit-core = { path = "../arbkit-core" }
arbkit-match = { path = "../arbkit-match" }
arbkit-feed = { path = "../arbkit-feed" }
thiserror = { workspace = true }

[dev-dependencies]
arbkit-sim = { path = "../arbkit-sim" }
proptest = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
# Live runner only (example-level): sync HTTP client for the ingest stream.
# Example code sits outside every crate's src/, so no production target and
# above all not the hot path ever sees this.
ureq = { version = "2", default-features = false, features = ["tls"] }
