[package]
name = "arbkit-feed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Venue connectors, feed event models, and tape recorder"

[features]
default = []
live = ["dep:tokio", "dep:tokio-tungstenite", "dep:futures-util", "dep:reqwest", "dep:rsa", "dep:sha2", "dep:base64", "dep:rand"]

[dependencies]
arbkit-core = { path = "../arbkit-core" }
arbkit-match = { path = "../arbkit-match" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"], optional = true }
tokio-tungstenite = { version = "0.26", optional = true, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
# Kalshi's market-data WebSocket requires the same RSA-PSS signing as the
# REST API; the feed signs its connect handshake when credentials are set.
rsa = { version = "0.9", features = ["pem", "sha2"], optional = true }
sha2 = { version = "0.10", optional = true }
base64 = { version = "0.22", optional = true }
rand = { version = "0.8", optional = true }

[dev-dependencies]
proptest = { workspace = true }
